<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D4A3E" />

    <!-- Primary meta (per-route values are set by <Seo/> on the client and by the
         Worker for crawlers that don't run JS). 143 chars — under the 160 limit. -->
    <title>Culina — Where food businesses are born and grow</title>
    <meta name="description" content="The all-in-one platform for shared commercial kitchens and the food entrepreneurs inside them — booking, compliance, storefronts, and growth." />
    <link rel="canonical" href="https://culina.life/" />

    <!-- Google Search Console: paste your verification token here (or verify via DNS/GA). -->
    <!-- <meta name="google-site-verification" content="YOUR_TOKEN_HERE" /> -->

    <!-- Open Graph -->
    <meta property="og:site_name" content="Culina" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Culina — Where food businesses are born and grow" />
    <meta property="og:description" content="The all-in-one platform for shared commercial kitchens and the food entrepreneurs inside them — booking, compliance, storefronts, and growth." />
    <meta property="og:url" content="https://culina.life/" />
    <meta property="og:image" content="https://culina.life/og.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Culina — Where food businesses are born and grow" />
    <meta name="twitter:description" content="The all-in-one platform for shared commercial kitchens and the food entrepreneurs inside them." />
    <meta name="twitter:image" content="https://culina.life/og.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Structured data: the SaaS product itself. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Culina",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://culina.life/",
        "description": "The all-in-one platform for shared commercial kitchens and the food entrepreneurs inside them.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Structured data: the organization. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Culina",
        "url": "https://culina.life/",
        "logo": "https://culina.life/favicon.svg",
        "sameAs": ["https://twitter.com/culinahq"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
